limo_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 100

limo:
  type: diff_drive_controller/DiffDriveController

  left_wheel:
    - front_left_wheel
    - rear_left_wheel

  right_wheel:
    - front_right_wheel
    - rear_right_wheel

  wheel_separation: 0.172
  wheel_radius: 0.048

  publish_rate: 100
  cmd_vel_timeout: 0.2

  # 速度 / 加速度限制
  linear:
    x:
      has_velocity_limits: true
      max_velocity: 1.0
      min_velocity: -1.0

      has_acceleration_limits: true
      max_acceleration: 2.5
      min_acceleration: -2.5

  angular:
    z:
      has_velocity_limits: true
      max_velocity: 1.0
      min_velocity: -1.0

      has_acceleration_limits: true
      max_acceleration: 3.2
      min_acceleration: -3.2

  pose_covariance_diagonal:
    [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]

  twist_covariance_diagonal:
    [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]